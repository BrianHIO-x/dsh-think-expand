  <title id="demo-title">dsh-think-expand 行为示意：手动保持与每会话 Think 开关（合成插图 / synthetic illustration）</title>
  <desc id="demo-desc">功能示意 · 合成内容。上方状态显示手动点开的 Think 行在开关关闭时保持展开；下方状态显示会话标题栏的 Think 开关批量展开本会话的 Think，工具卡与不含 Think 的分组保持折叠。Illustrative demo · synthetic content. Not a DSH screenshot, not a version test. Switch states live in window memory and reset on reload.</desc>
